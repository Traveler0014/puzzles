source: "phys.org 2026-11 报道《New tool tracks unintended CRISPR edits and their effects in individual cells》；背景为 CRISPR/Cas9 脱靶编辑与单细胞基因组学的公认结论"
sourceUrl: "https://phys.org/news/2026-11-tool-tracks-unintended-crispr-effects.html"
author: "auto"
status: draft
question: |
  2012 年起，CRISPR/Cas9 被叫作「分子剪刀」：给它一段向导 RNA，它就会去剪对应的 DNA 序列。直觉是——只要向导设计得足够特异，剪刀就只落在目标位置，对吧？可事实是它会在基因组别处留下「脱靶」切口。更反直觉的是：把编辑过的细胞拿去做全基因组测序，也常常「看不到」这些脱靶。既然连每个字母都能测，为什么测不到一次明明发生过的误剪？（提示：先想清楚，你测的到底是谁的 DNA。）
answer: |
  因为常规全基因组测序测的不是「一个细胞」，而是成千上万个细胞混在一起的平均值。假如一百万个细胞里只有几十个在某处被误剪，这点信号在混样里会被稀释到接近噪声底，看上去和没剪过一样。而脱靶恰恰是罕见、随机、细胞各异的：向导 RNA 与目标序列差一两个碱基仍可能结合，切割效率还受染色质是否开放影响，所以同一批细胞里，每个细胞的脱靶位点并不相同——平均之后彼此抵消，等于什么都没看见。要看见，就得把细胞一个个分开测，这正是单细胞层面追踪脱靶工具的意义。还有第二层常被忽略：脱靶不等于一定有害。切口落在基因间区可能毫无后果，落在抑癌基因或调控区才可能出事。「有没有剪到别处」和「剪到别处有没有造成后果」是两个独立问题，前者靠更灵敏的检测，后者要靠功能实验。所以「分子剪刀很精准」这句话，准确说法是：它在群体平均意义上看起来很精准。
