id: hlx-biology-07
category: biology
difficulty: 2
source: "Quanta Magazine《How Virus-like ‘Jumping Genes’ Became Our Partners in Evolution》；转座子约占人类基因组一半、部分被宿主征用为功能元件为遗传学公认结论"
sourceUrl: "https://www.quantamagazine.org/how-virus-like-jumping-genes-became-our-partners-in-evolution-20260921/"
author: "auto"
status: draft
question: |
  你身上差不多一半的 DNA 并不制造任何蛋白质，而是像“跳跃基因”一样能在基因组里到处移动、自我复制。它们看起来更像寄生在细胞里的病毒残余，是典型的遗传垃圾，插进哪个基因里就毁掉哪个基因。可人类并没有被这群乱跳的家伙毁掉，反而把这段历史说成“与演化中的伙伴同行”。请想一想：这些跳跃基因为什么没有被自然选择清理干净？它们凭什么能占据我们近一半的基因组？顺便说一句，“它们因为跳不动了所以被淘汰掉”这个最顺手的答案，并不成立——因为它们绝大多数今天确实已经跳不动了，却仍然待在那里，而且大有用处。
answer: |
  先纠正直觉：它们活下来靠的恰恰是“跳不动”。今天人类基因组里的绝大多数转座子早已因突变失灵，成了化石；少数还活跃的（如 LINE-1）也被 DNA 甲基化、小 RNA 等机制牢牢沉默，只在胚胎早期、生殖细胞等场合短暂放开。真正让它们留存的是宿主把敌人改造成了工具：一，失活转座子留下的残余序列常被征用为基因的开关，人类基因组中大量增强子和启动子就来源于此，帮细胞决定何时何处开哪一段基因；二，少数直接被拆成关键零件——胎盘形成必需的合胞素，渊源正是病毒包膜蛋白，抗体多样性的 RAG1/RAG2 则来自一种转座酶。所以它们不是被清除，而是被驯化：能跳的继续埋隐患，跳不动的反而成了零件。宿主便在“沉默”与“征用”之间反复权衡，代价是每次跳跃都可能打乱基因——这一半基因组，就是这么来的。（可查：转座子约占人类基因组 45%–50%；合胞素、RAG 的转座子起源为公认结论。）
