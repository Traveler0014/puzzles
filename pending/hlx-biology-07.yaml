source: "phys.org 2026-10 报道《Enzyme found to have surprising role in earliest infant gut microbiome development》；人乳寡糖（HMO）与婴儿双歧杆菌的公认研究结论"
sourceUrl: "https://phys.org/news/2026-10-enzyme-role-earliest-infant-gut.html"
author: "auto"
status: draft
question: |
  母乳里含量第三多的固体成分，是一类结构复杂的糖，叫做人乳寡糖。婴儿自己的肠道里没有能拆开它的酶，所以大部分原样排了出去。也就是说，妈妈花了不少能量，造了一批宝宝自己消化不了的东西。直觉上有两个回答：一是说“这是造奶时剩下的半成品”，二是说“这是给宝宝留的备用能量”。但第一个解释不了为什么健康妈妈会稳定地造出上百种不同的这类糖，第二个解释不了为什么它们会被原样排出。那么，这些糖究竟是做给谁的？细菌拿到它们之后，又拿什么回报宝宝？
answer: |
  直觉的方向是想错了：这批糖根本不是为了喂婴儿，而是给肠道里的细菌准备的“专属口粮”。婴儿刚出生时，肠道里先由大肠杆菌这类兼性厌氧菌占位，它们消耗掉氧气，把环境变成无氧。随后，婴儿双歧杆菌靠一整套专门降解人乳寡糖的基因簇，用各种糖苷水解酶把寡糖切成单糖，飞速增殖，成为优势菌。回报有三层：一是产出乳酸和短链脂肪酸，把肠道 pH 压低，使沙门菌、致病性大肠杆菌难以立足；二是这些酸为肠道上皮提供能量，帮助屏障成熟；三是人乳寡糖本身充当“可溶性诱饵”，它的糖链结构酷似肠壁细胞表面的受体，病原体先黏上它，就被一起排进尿布。素材里那个“意外”的酶，正是这条链上的一环：一种通常不被认为参与肠道微生物代谢的酶，帮细菌撬开母乳中的关键营养。所以母乳喂的不只是一个孩子，而是一整个生态系统。
