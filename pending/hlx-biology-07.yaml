sourceUrl: "https://phys.org/news/2026-09-genes-flatworms-regenerate-brains-revealed.html"
author: "auto"
status: draft
question: |
  人的大脑受了伤，几乎没法自己修好。可实验室里有一种几毫米长的扁虫——涡虫，把它的头（连同脑）切掉，几周后它不光长出新头，连脑也重新长了出来。很多人第一反应是：「这不奇怪，涡虫是低等动物，全身都是干细胞，随便长长就有了。」这个解释其实什么也没解释。那涡虫到底靠什么把一整个脑重建出来？人类缺的又到底是什么？
answer: |
  「低等所以随便长」是个假解释：低等动物里不能再生脑的多得是，而涡虫的再生也绝非随便长长。
  涡虫体内散布着一种成体多能干细胞（neoblast），数量多、能全身游走。切头之后，它们迁移到伤口处，增殖并分化成包括神经细胞在内的各类细胞，再按位置信息重新拼出一个脑。佐治亚大学的研究者正是在这种涡虫里锁定了一批让脑再生得以发生的基因——也就是说，再生不是「默认就会」，而是被一套基因程序主动开启的。
  人类这边，缺的并不是干细胞本身：大脑里也有神经干细胞，但绝大多数神经元出生后就不再分裂，损伤处还会形成胶质瘢痕、释放抑制再生的信号，把修复按住。差别更像「开关开没开」，而不是「高等还是低等」。
  还有一层反直觉：涡虫不是在原地把断掉的脑缝回去，而是把全身的干细胞调来重建——更像拆零件重装，而不是愈合伤口。研究这些基因的意义，正是看将来能否部分地「打开」人类自己的修复开关。
