question: |
  餐厅酒单上常有一瓶贵得离谱的酒：别的酒大多两三百，它标价三千。直觉会说，这是为了卖给有钱人，或者为了摆阔。也有人解释成「锚定」：有三千在前面，其他酒就显得便宜了。可是，如果只想让你觉得便宜，为什么最后你挑中的常常是紧挨着它的那一瓶偏贵的酒，而不是最便宜的那瓶？这瓶天价酒到底做了什么，才让另一瓶酒变得好卖？（顺带一提：实验室里的老鼠，也会被同样的把戏骗进陷阱。）
answer: |
  关键不在「贵」，而在「被支配」。真正起作用的第三选项，必须是在各个维度上都不比某个目标选项更好、至少有一维更差的「诱饵」；它跟目标选项相似到可以比较，却又明显吃亏，于是目标选项在对比中显得占优。经典例子是杂志订阅：网络版59元；纸质版125元；网络加纸质125元。单看纸质版并不吸引人，但和「同价还多送网络版」一比，第三项立刻显得划算。诱饵被目标「不对称地支配」，选择这才被推过去。
  
  酒单上的天价酒扮演的正是这个角色：它的档次未必真比第二贵那瓶高多少，价格却高出一大截。你一旦在两者间来回比较，天平就倒向第二贵那瓶。那「锚定」的解释错在哪里？锚定只能说明你为什么觉得整体便宜，却解释不了你偏偏挑中这一瓶；若只是锚定，选择该整体下移到便宜区，而实际被推高的常常是紧邻的中高价档。
  
  老鼠的实验说明这套比较不需要懂钱、品牌和语言，是相当基础的决策机制，所以连陷阱的入口也能靠它来设计。
