question: |
  设想一条街：你借给朋友10万元开奶茶店，他拿这10万只能买你的原料；开张后你每天再花20元买他的奶茶。年底一算，你多了10万营业额，他也多了10万流水，大家都说生意在增长。先别急着说「这是骗局」——每笔交易都合法，货也真的交付了，钱也真的转了。那这条街上到底有没有多出财富？如果没有，账面上那份「增长」是怎么来的？这个循环靠什么维持，又会在什么时候断掉？
answer: |
  没有多出财富。这条街唯一的外部收入就是你们俩自己的钱包，钱在闭环里转一圈，原料和奶茶却被真实消耗掉了，净财富甚至是负的。关键在于：同一笔钱每经过一家公司，就被记一次营业收入，于是三个人的「增长」其实是同一块钱的三次回声。这正是当下 AI 热潮中被讨论的「循环交易」加「供应商融资」：芯片商投资客户，客户拿这笔钱回头买芯片，供应商、投资人、客户三位一体。反直觉之处在于——它不是造假，账目可以完全真实；问题在「相关性」而非「真实性」：这些收入里有多少是独立第三方真正掏的钱？循环靠两件事维持：外部客户最终买单，以及融资一直便宜。一旦外部需求不及预期或资金收紧，订单与收入会同时反向收缩，泡沫就是这样被抽掉气的。
