id: hlx-tech-02
category: tech
difficulty: 2
source: "Quanta Magazine《Network Researchers Nail Down Theory of 'Perfect Resilience'》（2026）；路由环路与「计数到无穷」为距离矢量路由（如 RIP）的经典结论"
sourceUrl: "https://www.quantamagazine.org/network-researchers-nail-down-theory-of-perfect-resilience-20261120/"
author: "auto"
status: draft
question: |
  手机导航说「前方封路，已为你重新规划」，你总归到得了目的地。可网络里的数据包没这么幸运：某条线路断掉后，两台机器明明还连着一条可走的路，消息却在几台路由器之间绕圈，永远送不到。
  最直觉的解释是「路已经断了」或「多绕几次总能绕出去」。先用一个很小的例子把这两种说法都证否，再想想：既然路是通的，让消息打转的到底是什么缺了？
answer: |
  第一种说法「路断了」直接不成立：题目已说明两台机器之间仍有通路。第二种「多绕几次总能绕出去」也不成立——若每个路由器只照本地那张「去某地该往哪个口走」的表转发，绕圈就是绕圈，转到多少次都回到同一处，不会自己变好。
  关键在于：能送到 ≠ 存在一条路。「存在路径」是站在全局地图上才成立的结论，而转发是局部的——每台路由器只知道自己邻居的状况。线路一断，各家的表要靠互相通告才能慢慢改正；改正之前，A 以为经 B 能到，B 以为经 A 能到，两条已经失效的信息互相支撑，跳数越数越大，这就是距离矢量路由里经典的「计数到无穷」。
  Quanta 报道的结论是：打转不是运气差，而是网络里存在四种特定的简单小结构。只要网络含有其中一种，就一定有某种断线方式让它转圈；四种全避开，才叫「完美弹性」。
