question: |
  打一把石刀，最容易想到的做法是：把石头敲得越薄越锋利越好；用钝了就扔掉，再找一块。但在中国西南 27 处遗址出土的石器里，考古学家看到的却是另一套做法：许多石片被反复修锐，刃口一再更新；还有一些器物本身既是「刀」，又被当成「原料」，从它身上再剥下新的薄片去做别的刃口。一件工具的寿命快结束时，它还在「供货」。这看起来很麻烦：如果石头到处都有，多敲几下、多捡一块不就更省事？那么问题来了——在什么条件下，「把用钝的工具当矿用」反而是最划算的策略？而那种「越薄越锋利才越好」的直觉，又错在哪里？
answer: |
  错在把「锋利」当成了唯一目标。真正的目标函数是：每单位重量的石料能产出多少可用刃口长度，并且考虑把石头从产地搬到住地的成本。好石料（细粒、破裂可预测的燧石、石英岩）在自然界并不是均匀铺开的，往往呈斑块状分布，离营地很远；搬运石头又重又费劲。于是最优解不是「每件工具最锋利」，而是「每块石料最耐用」：故意保留厚度和较大的刃角，牺牲初始锋利度，换取刃口可以一次次重修；到了寿命末期，剩下的核心体还能当石核，剥下最后几片小石片继续用。这就是 reduce–resharpen–reuse 的原料经济，而不是技术落后。反过来说，如果优质石料就在脚边、极其丰富，那么一次性薄片反而更划算——考古记录里确实存在这种组合。所以同一套行为是随石料可得性与搬运成本变化的条件性最优，而不是「越省越进步」的绝对阶梯。中国西南多地在石料稀缺的环境下呈现相似模式，正是这种区域性格局的体现。
