question: |
  深秋到初冬的北极，气温早已低于0°C，可地表土壤温度却会在接近0°C的“平台”上停留数天甚至数周，这叫“零幕”。有人以为这是土壤像被子一样保温，其实另有原因。猜猜看：为什么土壤温度会卡住不动？
answer: |
  真正的原因是水结冰时会释放大量潜热。土壤孔隙里含有水分，当温度降到冰点以下，液态水开始结冰，结冰放出的热量会缓慢抵消土壤向寒冷空气散失的热量，使土壤温度稳定在冰点附近，直到所有能冻的水都冻完，温度才会继续下降。这就像严冬里的一盆水，水面结冰期间，水温一直维持在0°C。北极的“零幕”能持续更久，是因为土壤多孔、水分布复杂，需要逐层逐孔隙冻结；土壤水中溶解的盐分还会降低局部冰点，一些吸附在颗粒表面的水更难结冰，让潜热“细水长流”地释放。这个现象并非保温，而是相变在调节温度。它对气候有深层影响：冻结延迟会改变土壤微生物活动，影响甲烷和二氧化碳的释放，进而反馈给气候模型——这也是NASA要用AI绘制零幕地图的原因。
