question: |
  望远镜能看到的最远处，是大爆炸后约 38 万年发出的光——宇宙微波背景。奇怪的是，这之后好几亿年，宇宙反而“看不见”了，像一锅雾，我们找不到那段时间的星光；要等到更晚，第一批恒星和星系把雾“吹散”，深空才重新变透明。按直觉，宇宙一直在膨胀、越来越稀薄，应该越来越透明才对。为什么中间反而变浑浊了？先别急着说“因为那时还没有星星”——没有光源，不等于不透明。
answer: |
  关键在于：透明不透明，取决于气体“对不对得上光的频率”，而不是气体有多稀薄。
  
  38 万年时，电子和质子结合成中性氢，光子第一次自由穿行，这就是微波背景。但这批中性氢虽然极其稀薄，对波长刚好等于氢原子能级差的光（莱曼系共振线，尤其莱曼α）吸收截面极大，约比普通散射大十几个数量级；极少量中性氢就能把这类光子反复吸收再发射，全部“吃掉”。天文学家在类星体光谱里看到的 Gunn-Peterson 吸收槽就是证据。所以严格说，那锅“雾”只对特定波段不透明，宇宙是“选择性失明”，不是整体变稠。
  
  后来第一代恒星和星系（JWST 正在看的那些）发出紫外光，把氢重新电离成自由电子和质子。与中性氢的共振吸收相比，自由电子对光的汤姆孙散射弱得多，共振吸收随之消失，宇宙在紫外和可见光波段就重新透明了。
  
  留下的线索是：少量自由电子仍会轻微散射微波背景光子，形成约 5% 的“雾痕”（光学深度 τ≈0.05），这正是我们测量再电离何时发生的依据。反直觉之处在于：稀薄不等于透明，物质的“频率匹配”才决定你能否看穿它。
