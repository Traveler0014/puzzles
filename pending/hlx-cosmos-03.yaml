id: hlx-cosmos-03
category: cosmos
difficulty: 2
source: "牛顿《自然哲学的数学原理》中的「牛顿大炮」思想实验；轨道力学常识（近地轨道环绕速度约 7.8 km/s）"
sourceUrl: "https://phys.org/news/2026-09-spacex-aims-starship-orbit.html"
author: "auto"
status: draft
question: |
  扔石头时，力气越大扔得越远。牛顿曾设想：如果力气大到不可思议，石头会一直飞下去，绕着地球转、再也落不下来。如今 SpaceX 的星舰要做的正是这件事——首次「进入地球轨道」。很多人以为，所谓进入轨道，就是「往上飞得足够高」：飞过 100 公里算进了太空，飞到几百公里就「在天上待着」了。可是同样冲到 100 公里以上的探空火箭，几分钟后就掉回地面；国际空间站在约 400 公里高处，却能一圈一圈转上好几年。为什么「高度」本身并不能让人留在轨道上？要真正进入轨道，星舰缺的到底是什么？
answer: |
  关键不在「到某个高度」，而在「快到落不下来」。牛顿的大炮设想里，抛出的物体同时做两件事：向前飞，向下落。地球表面是弯的，物体每向前约 8 公里，地面就下沉约 5 米。如果它每秒能前进约 7.8 公里（近地轨道的环绕速度），那么它一秒内下落的高度，恰好等于它前方地面弯曲下沉的幅度——于是它永远在「落」，却永远落不到地上，这就是环绕。国际空间站里的失重，不是因为那里没有引力（400 公里高处的引力仍有地面的约 89%），而是因为它一直在自由落体，只是横向速度太快。所以星舰真正难的不是爬高：飞到 100 公里只需约 1.4 km/s 的垂直速度，探空火箭和蓝色起源的新谢泼德都能做到；而进入近地轨道需要约 7.8 km/s 的水平速度，再算上重力与空气阻力损耗，总共要凑出约 9.4 km/s 的速度增量，其中大头用于「横向加速」而非「向上抬升」。这也是为什么把载荷送进轨道，比把它送到同样高度要难得多。
