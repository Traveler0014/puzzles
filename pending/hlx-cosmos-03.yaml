question: |
  同样一场大地震，有的山区震后滑坡不断、河流像被按了快进键，几十年都缓不过来；有的山区却像没事发生，只有零星落石。直觉上会说：离震中越近，破坏越强，反应越剧烈。可事实并非如此——决定山区反应强烈程度的，不是震中距，而是山体自身的一个几何特征。你能想到是哪个特征，并说出它为什么能决定‘震后有没有后劲’吗？
answer: |
  想不出也没关系，这个问题本来就要留到明早。真正起关键作用的，是山体地形的陡峭程度与河流下切能力之间的关系，具体可用‘地形陡峭度（channel steepness）’来概括。地震时山坡被震松，会形成大量滑坡碎屑；这些碎屑要离开山区，必须靠河流搬运。如果河谷足够陡、水流下切力强，碎屑就会被快速冲走，滑坡面直接暴露，侵蚀因此持续加速，山区进入‘强后劲’的快速重塑期。反之，如果河谷平缓、搬运力弱，碎屑就堆积在原地，像一层保护壳盖住坡面，后续侵蚀反而被抑制，地表表现出‘有限响应’。所以，震后反应强弱并非简单由震中距决定，而是由地形是否‘连得通、排得走’决定——山体的几何骨架，决定了它对地震这一记重拳会反弹多久。
