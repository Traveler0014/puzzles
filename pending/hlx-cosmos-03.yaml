question: |
  厄尔尼诺年，太平洋赤道东部的海水会比常年明显偏暖。躺下先猜一件事：是谁把这盆水加热的？
  最直觉的答案——「那年太阳晒得更狠」——其实站不住脚：厄尔尼诺年的赤道东太平洋上空云反而更多、日照更少，海面还在往外散热。
  那么，这些多出来的热量究竟从哪儿来？平时的东太平洋又为什么偏冷？
answer: |
  热水不是在那儿晒出来的，是从西边搬过去的。
  
  正常年份，赤道东南信风常年把表层暖水往西推，暖水堆积在印尼、澳洲一侧，那里的海面比东边高出约半米。东太平洋的表层暖水被吹走后，只能靠深层冷水上涌补位，所以秘鲁沿岸常年偏冷，甚至适合冷水鱼。
  
  厄尔尼诺发生时，信风减弱甚至反吹。西边那堆暖水失去支撑，便以开尔文波的形式沿赤道向东「倒流」，同时温跃层（暖水与冷水的分界）在东边下沉变深，冷水上涌被压住。于是东太平洋海温升高——本质上是暖水重新分布，而不是海洋总热量忽然增加。
  
  代价是两头调换：西太平洋（澳洲、印尼）海温偏低、对流减弱，容易干旱少雨；东太平洋变暖、对流旺盛，秘鲁厄瓜多尔一带暴雨成灾。
  
  所以能量的源头仍是太阳，但厄尔尼诺更像一次「分配问题」：总量没怎么变，水被搬了个家。赤道太平洋那点海面高度差，竟能牵动全球天气。
