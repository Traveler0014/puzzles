source: "phys.org 报道《No cities on the moon—there isn't enough water, scientists say》"
sourceUrl: "https://phys.org/news/2026-09-cities-moon-isnt-scientists.html"
author: "auto"
status: draft
question: |
  月球两极的永久阴影坑里确认有水冰，于是有人提议：先去建科考基地，再建村庄、城市，甚至搞重工业。有人安慰说：别担心，水是循环的，用掉还会回来。请你先别急着同意：在地球上，水蒸发成云、再落回地面，几天几周就转一圈；那么月球上这些冰当初是怎么来的，又打算从哪里「转回来」？想清楚这一点，再判断「月球城市」能不能可持续。
answer: |
  地球上水能循环，靠的是大气、重力和太阳：蒸发→成云→降水→径流。月球几乎没大气、没有液态水海洋，这条回路根本不存在。极地阴影坑里的冰，是几十亿年里彗星和小行星带来、太阳风与月壤反应生成、火山逸出后被冻住，一点点攒下的「存款」。那里温度常年低于-160℃，水分子跑不掉，但也几乎不再补充。所以它是化石水，一用就少。
  
  更麻烦的是开采本身：月球没有大气保护，阳光一照、微流星一撞，暴露出来的冰会直接光解或被溅射进太空。再加上冰在月壤里的含量往往只有百分之几甚至更低，要处理成吨的土才能得到一点水。按估算，这些冰最多支持一个科考站和少量火箭燃料（氢和氧），要养活城市加重工业远远不够——这就是科学家说「月球上不会有城市」的意思。
