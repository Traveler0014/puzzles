source: "phys.org：Mars dust may be less abrasive than lunar dust, spacesuit samples suggest（NASA 毅力号火星车航天服材料样本实验）"
sourceUrl: "https://phys.org/news/2026-10-mars-abrasive-lunar-spacesuit-samples.html"
author: "auto"
status: draft
question: |
  火星上沙尘暴频繁，灰尘无孔不入；月球没有风、没有雨，灰尘似乎只是静静躺着。直觉上，火星灰应该更“磨人”。但科学家把几小片航天服材料样本挂在毅力号上做实验后，反而认为火星尘可能不如月尘磨蚀。假设两边颗粒大小相近，最可能造成这种反直觉差别的原因是什么？别只答“火星灰尘更软”——真正关键可能不在软硬。
answer: |
  关键在颗粒形状和“经历”。月尘长期暴露在无大气环境中：微陨石撞击、太阳风轰击会把岩石打碎并熔出玻璃质小颗粒，形成大量带尖角、锯齿状的碎片；没有风和水来磨圆它们，所以月尘像极细的砂纸，还会因静电牢牢吸附在航天服上。火星尘虽然多、还会被沙尘暴搬来搬去，但正因为它被风反复吹起、碰撞、沉积，颗粒棱角更容易被磨圆；火星历史上还可能有水参与风化。磨蚀不只看灰尘多少和软硬，更看颗粒是否尖锐、是否带玻璃质刃口。因此“沙尘暴多＝磨损更凶”是直觉陷阱：频繁搬运反而可能把火星尘磨得更圆滑。该判断来自毅力号携带航天服材料样本的暴露实验，仍需长期数据确认。
