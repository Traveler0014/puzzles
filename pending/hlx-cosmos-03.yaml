source: "phys.org 报道《Record El Niño? Depends who's counting》；NOAA CPC 对 ONI 的定义与三十年滚动基准期的通行做法"
sourceUrl: "https://phys.org/news/2026-10-el-nio.html"
author: "auto"
status: draft
question: |
  同一次厄尔尼诺，三家机构给出三种说法：英国气象局称它「前所未有」，日本气象厅称它「有观测记录以来最强」，美国预报机构却说「还比不上史上最强的几次」。他们看的是同一片赤道太平洋、同一批卫星与浮标数据，谁都没造假，也都可能没说错。先别急着下结论「总有一家在吹牛」。请想一想：「最强」到底可以怎么被量出来？要让两个年份的厄尔尼诺能比大小，你必须先把哪几件事固定住？又为什么绝对海温破了纪录，距平反而可能没破？
answer: |
  「最强」不是观测到的事实，而是「指标＋基准＋时间窗」三者一起作出的判断。
  
  第一把尺子：强度可以指赤道中东太平洋（Niño3.4 区）的海温距平，也可以指绝对海温、上层海洋热含量，或大气响应（南方涛动指数、赤道西风爆发、对流东移）。海温暖却信风不弱、对流不东移，只是「暖水块」，常被降级甚至不算事件。指标不同，排名就不同。
  
  第二把尺子：距平要减掉「气候平均」，而各国用的基准期不一样，比如 1981–2010、1991–2020；美国还每五年滚动更新一次三十年基准。全球变暖让新基准一年比一年暖，同样的海水，减掉更暖的基准，距平就缩水。于是绝对海温刷新纪录、距平却排不进前列，这正是「破纪录」与「不够强」能同时为真的原因；用较老基准的机构，距平自然显得更大。
  
  第三把尺子：区域（Niño3.4、Niño3、Niño1+2）、时间窗（单月峰值还是三个月滑动平均）、事件持续多久。
  
  所以三家都在如实报数，只是各拿各的尺子和零点。要让它们可比，必须同一指标、同一基准期、同一时间窗。下次看到「史上最强」，先问：比的是什么，从哪儿量起。
