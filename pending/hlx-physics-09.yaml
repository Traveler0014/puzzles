question: |
  印尼的森林和泥炭地一连烧了好几周，浓烟飘到几百公里外，让新加坡、马来西亚连着好些天雾蒙蒙。有个细节值得想一想：烟里那些黑色小颗粒比空气重得多，为什么它们能在天上待上好几天，而不是很快落下来？（先排除一个最顺口的答案：「风一直吹」。风只能把烟往水平方向送，管不了它掉不掉。）
answer: |
  关键在颗粒有多小。对微米级的颗粒来说，空气不是稀薄的，而是非常黏的：它受到的阻力远大于惯性，沉降速度遵循斯托克斯定律，与半径的平方成正比。直径两微米左右的烟尘颗粒，沉降速度只有大约每秒万分之一米——一天才落下十来米；而白天地面受热产生的对流和湍流混合，会不断把它们重新卷上去，混合层常常厚达一两千米。所以重力几乎被湍流「打败」了，颗粒基本是跟着空气一起漂，被风送几百公里毫不费力。真正把颗粒从大气里清走的不是重力，而是雨：雨滴在下落途中捕获颗粒并带到地面，也就是湿沉降；颗粒随机撞上地面、树叶也算一条出路。旱季少雨，清除机制缺位，烟霾就能一挂几周。
