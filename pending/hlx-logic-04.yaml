question: |
  如果只剩下这一根同样的不均匀香（烧完1小时），打火机充足，能不能用它精确量出45分钟？你可以在任意时刻点燃或熄灭它，也可以从两头点，但不能折、不能剪，也没有其他计时工具。直觉上似乎可以先点一头，等一段时间再点另一头，但那段等待时间怎么确定？请给出能或不能的结论并证明。
answer: |
  不能。理由：一根香只有两个端点。如果一开始就两头同时点燃，那么30分钟烧完；如果只点一头，则60分钟烧完。想得到45分钟，就需要先点一头烧一段时间t，再点另一头。但t必须是精确已知的，而这根香本身能标定的确定时刻只有30分钟和60分钟，它们都不是45分钟所需的触发点。更本质地说，从一头点燃时，火焰到达某个中间位置的时间完全未知（因材质不均匀），你没有任何确定事件可以作为“此时点另一头”的信号；凭感觉等待不叫精确计时。因此一根香最多只能给出30分钟和60分钟两个确定时长，无法得出45分钟。要突破限制，至少需要第二根香来充当30分钟的闹钟，这正是原题的方法。
