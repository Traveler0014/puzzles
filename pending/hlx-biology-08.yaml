question: |
  13—16世纪，丹麦与瑞典之间那道海峡里捞出的鲱鱼，腌一腌就养活了半个北欧。可1570年前后渔场突然崩了：鱼不见了，渔民也就撤了，几乎没人再捕它。按常识，捕捞压力一撤，鱼群几年就该缓过来——然而捕捞量要回到当年的水平，等了将近400年（直到1950年代）。没人捕的鱼，凭什么『消失』这么久？先别急着说『它们只是游到别处去了』：鱼群里被打捞走的，除了鱼本身，还有什么？
answer: |
  最直觉的答案：只要人不捕，鱼群就会像休耕的田一样自己长回来。鲱鱼偏偏不是田里的庄稼。
  一、地图丢了。鲱鱼成群洄游，何时出发、去哪产卵、走哪条路，多半是跟着老鱼学来的『集体记忆』。鱼群被压到很低时，这套记忆随老鱼一起消失，剩下的小群只能重新摸索；鲱鱼四五年一代，四百年是上百代。
  二、房客换了。鱼群腾出的位置不会空着——黍鲱、浮游生物、捕食者会重新占位并稳定成一个新格局，反过来压住鲱鱼回升，这就是『生态系统状态转移』。
  三、房子也变了。1570年前后正逢小冰期，波罗的海的盐度、水流、水温都在变，产卵场变得不合适；环境不恢复，光靠人类停手没用。
  四、密度陷阱。鱼太少时找同伴、产卵、躲天敌都更难，数量越低越难增长，得跨过某个门槛才能翻身。
  所以恢复要同时等回记忆、生态位和环境——400年就这么过去了。
