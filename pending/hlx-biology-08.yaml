question: |
  全球八十亿人天天呼吸，一年呼出的二氧化碳加起来约 20 亿吨——比德国一年的排放量还多。既然数字这么吓人，为什么气候科学家几乎从不把「人类呼吸」算进温室气体排放清单？先别急着用「因为总量还不够大」来回答：它确实和某些工业国的年排放相当。那真正的区别在哪里？再顺带想一想：你呼出的那口 CO₂ 里，那个碳原子是从哪儿来的？
answer: |
  关键在于碳的「年龄」和它的循环路径，而不是数量。你呼出的碳原子来自食物里的糖、脂肪、蛋白质，而这些碳最初是植物或藻类通过光合作用从大气中吸走的 CO₂；动物吃植物，人再吃动植物。所以呼吸不过是把植物不久之前刚从空气里取走的碳还回去，形成一个几年内就能闭合的「快碳循环」，净新增接近零。煤和石油则不同：那是几亿年前被埋进地下的碳，挖出来烧掉才是真正往大气里新增碳。第二个容易想错的地方是：CO₂ 里的碳并不来自你吸进的氧气——氧气只是电子受体、是「搬运工」，碳骨架全部来自食物；顺带一提，人减掉的脂肪，大部分正是这样以 CO₂ 和水形式呼出去、排出去的。所以那 20 亿吨是实实在在的物质流，却不是净新增的温室气体——除非食物生产本身烧了化石燃料（化肥、农机、运输），那部分才记在农业账上。
