source: "蒂宾根大学乌鸦运动方向判别实验（2026，phys.org 报道）；反应时相减法（Donders）；速度—准确性权衡（Wickelgren, 1977）"
sourceUrl: "https://phys.org/news/2026-10-crows-decisions-fast-humans-monkeys.html"
author: "auto"
status: draft
question: |
  屏幕上的光点往左还是往右飘——乌鸦平均只要 235 毫秒就能判断并作答，大约是人类和猴子的一半。直觉会说：乌鸦脑子那么小，居然比我们转得快一倍。先别急着信。任何一次「看见并回答」都包含几段谁也躲不掉的固定延迟：眼睛把光换成神经信号、信号传到脑、脑发出命令、命令传到肌肉，加起来往往上百毫秒，人和乌鸦都一样。如果这段固定开销是 150 毫秒，那么落在真正「做判断」那一段上的差距，会是几倍？另外，「我比你快一倍」要在什么前提下，才是一次公平的比较？
answer: |
  先做减法。235 毫秒和 470 毫秒里，都含有一段谁也省不掉的硬件时间：光感受器换能、视网膜到脑的传导、脑到肌肉的命令、肌肉收缩。若这段固定开销约 150 毫秒，留给「判断光点往哪边动」的时间就是：乌鸦约 85 毫秒，人约 320 毫秒——差了近四倍，而不是标题里的两倍。常数一减，比值就被放大，这是拿总时间做比较时最常见的陷阱；若固定开销更小，差距只会更夸张，所以「两倍」其实是低估。
  
  再问公平性。速度与准确性此消彼长（速度—准确性权衡）：允许出错，任何动物都能更快。只有在同等正确率下比时间才有意义——这项实验强调的正是乌鸦在保持高准确率的同时做到 235 毫秒。
  
  还有两点别过度解读：实验只有两只乌鸦，样本极小；乌鸦没有分层的大脑皮层，却有神经元密度很高的等效结构，「脑子小所以反应慢」本就不是必然。启示是：听到任何「快一倍」，先问它减掉了什么常数、在什么准确率下测得。
