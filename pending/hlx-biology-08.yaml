question: |
  人体里有些细胞上了年纪会变成「僵尸细胞」：它们不再分裂，却也不死，赖在组织里不走。直觉上这没什么可怕——一个不分裂的细胞，总比一个疯狂增殖的细胞安全。可研究发现，正是这些僵尸细胞会加速组织老化、引发慢性炎症，还和癌症有关。那么，一个已经「停工」的细胞，凭什么比正常干活的细胞更危险？如果有人回答「它只是占着地方、抢营养」，那解释不了它为什么能影响远处的组织。它究竟在做什么？
answer: |
  关键在：衰老（senescence）不是「关机」，而是「换岗」。细胞停止分裂，通常是因为 DNA 损伤或致癌基因被激活，它主动按下停工开关（p53、p16 等通路）——这在短期内确实防癌，不让受损的遗传信息被复制下去。但它没有死，反而变成一个高产的分泌源，持续往外释放炎症因子、蛋白酶和生长因子，这套行为叫 SASP（衰老相关分泌表型）。这些信号本意是招呼免疫细胞来把自己清理掉；可年纪大了免疫系统效率下降，僵尸细胞越积越多，长期的低度炎症就在慢慢损伤周围组织、改写局部微环境，甚至给邻近细胞递上促癌的生长信号。所以「短期防癌、长期促癌」不是矛盾，而是同一套机制的两面：问题不在它占地方，而在它一直在「喊话」。素材里 MIT 的工作，正是用拉曼显微加 AI 给这些细胞打出非侵入的「条码」，好把它们早早认出来、清出去。
