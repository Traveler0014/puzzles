question: |
  一台机器用久了会磨损，人也一样：头发白、皮肤皱、腰腿不灵。按这个“磨损”直觉，衰老应该像机器一样，所有零件随机地、大致均匀地变差。可为什么现实中，有的人心脏还行、大脑却先衰退，有的人则相反？这像是有人在按顺序“安排”衰退。那么，衰老到底是随机损耗，还是一场有计划的“程序”？换句话说，如果衰老是程序，它和磨损最本质的区别是什么？
answer: |
  最本质的区别是：磨损是“被动累积的随机损伤”，而程序是“主动执行的指令”。Quanta Magazine 的报道中，Junyue Cao 通过分析数百万小鼠细胞的分子特征发现，衰老不是随机磨损，而是“细胞社会的重塑”——衰老过程中，细胞与细胞之间的关系、群体结构被系统性改变，就像社会在重新规划。这与零件坏了完全不同：磨损是被动的、累加的、方向无序的；程序是有方向、有步骤、可以被调控的。
  
  从物理角度，这并不违反热力学：生物体是开放系统，局部的有序变化以整体的能量耗散为代价，熵增始终成立。但“程序”意味着衰老可能被信息编码，因此存在被理解、被干预、甚至被重编程的空间。它也修正了直觉——衰老不是只能被动接受的“自然损耗”，而可能是一个主动的过程。
