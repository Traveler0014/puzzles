question: |
  一场野火烧在几百英里外，你看不见火、甚至闻不到烟，但经济学家说你的钱包和健康同样会被它影响。很多人以为“火没烧到我这里，我就没有损失”——这个想法为什么是错的？请从空气、健康、经济三个角度各说出一条影响途径。
answer: |
  这个想法错在把野火的损失只看成“被火烧到”。第一环是空气：野火会产生大量微小颗粒物（如PM2.5），它们能随高空气流飘到几百甚至上千公里之外，肉眼看不见，但就在你呼吸的空气里。第二环是健康：这些细颗粒物会深入肺部甚至进入血液，诱发哮喘、心血管疾病，增加急诊和住院，对老人小孩尤其危险。第三环是经济：生病带来医药费和误工，降低劳动生产率；空气差还会让人取消旅游、不愿搬家找工作，损害当地商家、房价和税收。而且这些损失不需要谁“点燃”你，是由远方所有呼吸的人共同承担的，经济学把这种一个人对自己的行为（或自然灾难）不买单、却让公众付出代价的情况称为“外部性”。所以一场野火的经济成本往往被严重低估：烧掉的森林和房子只是冰山一角，看不见的烟雾可能伤及更远更多人的身体与钱包。
