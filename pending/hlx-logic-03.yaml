question: |
  三个人 A、B、C 竞选，每位投票人都把三人从最喜欢到最不喜欢排好序。计票方式是「两两对决、多数票者胜」：先比 A 对 B，再比 B 对 C，最后比 C 对 A。直觉是：「多数人更喜欢」这个关系应该像「比谁高」一样可传递——如果多数人认为 A 胜过 B、多数人认为 B 胜过 C，那多数人自然也认为 A 胜过 C，于是总能排出一个整体名次。这个直觉对吗？先别急着接受：请你构造一种情形（或说明为什么一定构造得出来），使得 A 胜 B、B 胜 C、C 胜 A，三个人互相击败，整场投票没有赢家。
answer: |
  直觉错了。这正是孔多塞在 1785 年指出的「投票悖论」，也叫循环多数。设三位投票人的偏好是：甲：A＞B＞C；乙：B＞C＞A；丙：C＞A＞B。逐对看：A 对 B，甲、丙选 A，A 胜；B 对 C，甲、乙选 B，B 胜；C 对 A，乙、丙选 C，C 胜。于是 A 胜 B、B 胜 C、C 胜 A，形成闭环，没有人在所有对决中胜出。若按顺序表决（先 A 对 B，胜者再对 C），结果会依赖议程：先比 A、B 则 C 赢，先比 B、C 则 A 赢——赢家由流程决定，而非由民意决定。关键错在哪？「比谁高」是同一个物体之间的传递关系；而「多数人更喜欢」每次比较用的其实是不同的一批人：A 胜 B 靠甲丙，B 胜 C 靠甲乙，要推出 A 胜 C 得靠同一批人的多数，但这里恰好不行。多数偏好的不可传递不是算错，而是结构性的。这也是素材里「克莱因瓶」比喻的用意：克莱因瓶没有一致的里外之分，正像这种偏好格局里不存在一个全局自洽的「谁最强」的排序——不是票数不够，而是问题本身没有那个答案。
