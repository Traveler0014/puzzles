question: |
  有两根材质不均匀的香，每根恰好烧完1小时。如何只用它们和一个打火机精确量出45分钟？注意：因为材质不均匀，把香折半或剪短不能保证对应一半时间。提示：一根香可以从两头同时点燃。
answer: |
  同时点燃A香的两端和B香的一端。A两端同时燃烧，两个火焰相向而行，由于两端都在烧，火焰相遇时整根A香烧完——这恰好是30分钟，且与燃烧是否均匀无关。此时B香已经烧了30分钟，还剩一些；立刻点燃B香的另一端，于是B香的剩余部分从两头同时燃烧，从此刻起到烧完的时间恰为15分钟。30+15=45分钟。这里要纠正一个直觉：不是把香对折，也不是等B烧到一半，而是用A的烧完作为30分钟信号，让B在后半段变成两头烧，把剩余的30分钟一分为二得到15分钟。关键原理：一根香从两头同时点燃，烧完时间总是一头点燃的一半，与均匀性无关。
