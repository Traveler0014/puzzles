source: "phys.org 报道《Modern forensics reveals human sacrifice in ancient Egypt's royal burials》；古埃及第一王朝阿比多斯王陵随葬墓群的考古与法医结论"
sourceUrl: "https://phys.org/news/2026-10-modern-forensics-reveals-human-sacrifice.html"
author: "auto"
status: draft
question: |
  古埃及第一王朝的国王葬在阿比多斯，陵墓四周密密麻麻围着数百座随从的墓——家臣、工匠、侍女，许多看起来是同一天下葬的。可现代法医检测他们的骨骼，却几乎找不到外伤。于是有人说：他们不是被杀的，只是死后陪葬而已。这个反驳成立吗？顺着想两层：一个人若真是被害死的，哪些死法可以完全不在骨头上留痕？又是哪些证据在说「他们是一起走的」？
answer: |
  不成立。「骨头上没有伤」既不能证有，也不能证无——骨骼只记录作用到骨头的伤害：被人勒死、闷死、灌毒、溺水，全都可能不留任何骨痕，所以外伤阴性无法排除他杀。真正指向殉葬的是排列与时间这两条证据：这些墓紧贴王陵、环绕排布，随葬品风格与王陵同期，整个墓区像是被一次性封好的；数百人同时入土，而死者偏偏是国王的家臣、工匠与侍女。瘟疫不会专挑王家班底，也不会与国王同穴同封。古埃及人相信国王死后仍需要他的宫廷，在葬礼上把这些人一并送走，是最自然的解释。当然学界并未完全定论：也有人主张部分随从是自愿赴死，或分几批埋葬，所以结论是「很可能殉葬」，而非铁证。
