question: |
  有些男生痴迷练气泡音、压嗓子，觉得声音越低沉越有男人味，女生一听就被迷住。可研究发现「voicemaxxing」往往没用，甚至会减分。奇怪的是，女生的确普遍更偏爱偏低的男声，为什么偏偏这种刻意压出来的低音炮反而让人反感？别急着归咎于“假”——想想声音里除了音高，还藏着哪些信号？
answer: |
  先拆一个误区：女性偏好低频男声是真实存在的统计偏好——低音常与较高的睾酮、较大体型挂钩，进化上可能暗示更强的资源获取与保护力。但吸引力不是单音高的游戏。phys.org报道的研究让男性刻意压低嗓音录音，再让女性打分，结果发现：压得越狠，评分越低。原因至少有两层。第一层是感知：人会敏锐识别发声的自然度。刻意压低时声带紧张、共鸣异常，属于过度“修饰”，像看到修图太狠的脸，大脑自动报警。第二层是信号学：声音同时传递情绪、真诚度与当下状态。僵硬的气泡音牺牲了语气波动，听起来像背台词，反而不如坦率的中音有感染力。所以关键从来不是“低不低”，而是声带状态与表达的一致性——自然低频加上丰富语调，才是女性真正会买单的“男声”。
