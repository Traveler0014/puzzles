question: |
  我们总以为抗体是抓病毒的“警察”，病毒是独自逃跑的“坏人”。但一项研究提示，新冠感染里有个“帮凶”：一种平时负责让血液凝固的蛋白质。请闭上眼睛想：这种凝血蛋白凭什么能同时帮病毒躲开抗体、又把它送到血管壁上？它难道是故意叛变吗？先别急着答“抗体不够强”或“病毒变异了”。
answer: |
  最直觉的答案是“抗体不够强”或“病毒变异了”，但这项研究提出的机制更反直觉：不是病毒单枪匹马逃跑，而是被一种凝血蛋白“护送”。这种蛋白叫纤维蛋白原，平时在血浆里负责止血：受伤时它会变成纤维蛋白，织成网拦住血细胞，把伤口堵住。新冠病毒感染时，这种蛋白会同时抓住病毒和血管内皮细胞，像一座分子桥。一方面，它把病毒表面盖住，正好挡掉中和抗体需要结合的位点，抗体来了认不出、抓不着；另一方面，它又把病毒往血管壁细胞上送，让病毒更容易接触并进入血管内皮。这样感染就不再只局限于呼吸道，还可能出现凝血异常和血管损伤。注意：蛋白质并没有“叛变”，它只是继续做自己最擅长的粘附和搭桥工作，结果被病毒借用了。研究也提示，干扰纤维蛋白原与病毒的相互作用，也许能成为辅助治疗的新思路。
