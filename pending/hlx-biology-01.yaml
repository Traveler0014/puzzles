question: |
  全球变暖让格陵兰海的须鲸在夏季迎来“进食狂潮”，可别以为这是因为海水变暖让鲸鱼泡澡更舒服——真正原因是它们吃到的东西变多了。从食物链的角度，你能想出至少两个让须鲸“不劳而食”的生态机制吗？哪一个机制是新闻暗示的主因？
answer: |
  乍一看，全球变暖对海洋生物应是普遍坏消息，但格陵兰须鲸却成了短期赢家，原因可以分两层想。
  
  第一层是“猎物搬家”：许多饵料鱼类（如鲱、毛鳞鱼）的适宜水温带随暖水向北扩展，原本太冷的格陵兰海如今出现了“鱼群自助餐”，须鲸只需追着吃。第二层是“冰门大开”：夏季海冰减少，原本被冰封的觅食海域开放，须鲸的活动范围变大；同时海冰融水带来营养盐，可能刺激浮游植物提前爆发，带动整个食物链提前启动。
  
  哪个是主因？新闻标题用“warming waters draw”点明：是水温升高直接“引来”了鱼群，因此鱼群向北迁移是更直接的驱动，海冰消融更像是配合因素。但要注意，这只是局部、短期的“赢家”故事——北极冷水生态系统的原住民正在失去家园，食物链一旦重组，今天的盛宴未必长久。气候变暖没有真正的“躺赢”，只有不断重洗的牌局。
