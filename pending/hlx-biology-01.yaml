question: |
  如果我们把衰老比作机器磨损，那磨损的速率应该取决于使用程度和环境。可现实中，同一物种的个体即使经历不同的辛苦，衰老的大致节奏仍很像：头发该白还是白，甚至该得某些老年病还是得。你觉得这更像“磨损”还是更像“程序”？为什么？
answer: |
  直觉上，衰老像机器用旧了——零件磨损、功能下降。但磨损论很难解释一个现象：如果衰老只是随机故障累积，那么经历不同生活的人，衰老节奏应该差异很大；可现实中同种个体的衰老顺序惊人地相似，甚至白发、皱纹的出现都有大致规律。Junyue Cao通过解码数百万小鼠细胞的分子特征发现，衰老不是细胞的零散崩溃，而是多组织协同的“细胞社会重塑”——像是被编排好的程序，在特定时间点启动，按顺序调整细胞类型、状态和相互作用。这更像发育的延续，而不是故障的堆积。磨损是意外，意外不可预测；程序是设定，设定有规律。所以“修复赶不上损伤”的说法并不完整——也许不是修不好，而是身体主动走向这个状态。至于程序为何存在、能否被改写，仍是前沿问题。
