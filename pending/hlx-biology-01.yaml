question: |
  很多人争论“性别只有男女两种”还是“性别是个光谱”。一位生物学家却说：都不对——生物性别既不是二元，也不是光谱，而是“多维”的。你觉得“多维”和“光谱”差在哪里？为什么说“光谱”这个比喻其实也把事实简化了？
answer: |
  “光谱”是一条连续的轴，从一端渐变到另一端；但生物性别并不是单一变量上分高低。它由好几组相对独立的特征共同决定：染色体（如XX、XY）、性腺（卵巢或睾丸）、激素水平、内外生殖器、第二性征等。多数人这些维度彼此一致，比如XX染色体+卵巢+较高雌激素；但现实中有各种错位组合，例如有XX染色体却发育出睾丸的人，也有XY染色体但对雄激素不敏感、身体呈现女性特征的人（雄激素不敏感综合征）。这些维度各有各的状态，排列组合起来有数十上百种，无法排在“从男到女”一条线上。“光谱”还容易让人误以为性别是均匀连续的渐变，可以按程度打分；但实际每个维度常常是离散的、二态的，只是它们不总是一致。所以“多维”强调的是：性别不是选一个标签，而是看一组性状各自如何分布；二元论错在只取一个维度，光谱论错在以为只有一个维度能连续变化——两者都简化了生物学事实。
