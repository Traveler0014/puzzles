question: |
  人的衰老，最像下面哪一种？
  A. 一部机器用久了，零件磨损、螺丝松动，渐渐散架
  B. 一部手机到了一定年限，系统主动推送更新，界面翻天覆地，旧功能被关闭
  C. 一座老房子风吹雨打，砖墙风化开裂，慢慢坍塌
  直觉会选哪个？而科学家用海量细胞数据发现的事实，可能让你重新选。
answer: |
  直觉往往选A或C，把衰老当成随机的“磨损故障”：细胞损伤累积、代谢废物堆积、DNA突变像补丁一样越打越多。但科学家朱月杰（Junyue Cao）分析了数百万个小鼠细胞的分子签名后发现，衰老更像B：不是故障，而是“细胞社会的重塑”。
  
  在衰老过程中，细胞并不是各自随坏随修，而是整体发生协调的转变——某些基因被主动关闭，另一些被启动，免疫细胞、组织干细胞的比例和状态如同被系统性地“重排”，甚至像手机更新后界面大变、旧功能停用。衰老是有顺序、有方向的分子程序，而不是随机事故。
  
  但这道题没有绝对答案：我们尚不清楚这个“程序”是演化留下的老化时钟，还是某种适应性重塑。真正反直觉的是：如果衰老是程序，那它就可能有“卸载”或“改代码”的入口，而不仅是修补磨损——这正是衰老研究最让人兴奋的窗口。
