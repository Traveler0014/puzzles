question: |
  不少人相信，葡萄酒知识是拿钱和岁月“泡”出来的：喝得多、喝得贵，慢慢就懂了。可一项研究控制收入、社会地位后发现，一个人对葡萄酒的“深层知识”主要由智力分数预测，而不是喝酒多少。聪明人并没有更多钱买酒，为什么他们反而更懂酒？闭上眼想一想，喝下一口酒时，高智力者的脑子里可能比其他人多做了什么？
answer: |
  智力与葡萄酒知识的关系，关键在于“深层知识”不是喝出来的，而是思考出来的。一名智力较高的人可能并不比酒友喝得更多，但他更擅长把每杯酒拆解成维度：颜色深浅暗示年份与葡萄品种，单宁结构指向酿造工艺，余味长度对应产区风土。这些维度过去需要长期经验才能建立，而高智力者会在脑中自动寻找规律、验证假设，把一两次体验泛化成一个可迁移的模型。研究还发现，这种发生在非功利领域的认知加工，并不依赖成绩或金钱等外部激励，说明智力本身就是一种主动组织经验的能力。因此，看似属于感官享受的品酒，最终拼的仍然是信息整合的效率——这正是智力测验想测的东西。所以“多喝自然懂”这种直觉错在低估了大脑对经验的再加工。
