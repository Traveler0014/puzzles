question: |
  十年来天文学家一直盯着一颗远方的星：它每隔一阵就猛地增亮许多倍，像在倒计时。直觉会告诉我们——能量一次次积累，它快要炸成超新星了。但新研究说：它不会炸，而且幕后黑手是一个我们以前从没看见过的「邻居」。请想一想：一颗星「反复」变亮这件事本身，凭什么能反过来证明它不会爆炸？如果不炸，那又是什么在让它一次次变亮？
answer: |
  关键在于：超新星是一次性事件。大质量恒星的核心一旦塌缩，整颗星会被撕开，核燃料与结构都不复存在，不可能「亮一阵、歇一阵、再亮一阵」。所以同一颗星十年里多次爆发式增亮，本身就否决了「即将核塌缩」这个选项——真正走向死亡的星只会给出一次信号，之后连星体都不在了。那么，能反复供能的东西只能在星体表层或星外：如果它有一颗一直没被看见的伴星，两星互相绕转，伴星物质落到主星上、两股星风相撞、或伴星在轨道上周期性遮挡与加热，都能造成可重复的亮度起伏。伴星难被发现，往往因为它太暗，或干脆淹没在亮邻居的强光里，也可能本身就是一颗致密星。这正是「超新星冒名者」这类天体的由来：船底座 η 星 1843 年那次大爆发曾让人以为它要死了，结果它至今还在，只是喷掉了部分外壳。反过来，真正的一次性爆炸会表现为迅速升到极亮、再按放射性衰变规律缓慢下降、此后那颗星彻底消失。所以判断一颗星会不会死，不看它多亮、涨得多急，而看它能不能「重来」。
