sourceUrl: "https://phys.org/news/2026-09-jwst-tiny-moons-exoplanet-great.html"
author: "auto"
status: draft
question: |
  天文学家宣布，一颗系外行星周围「没有卫星」，还说这是好消息。可隔着几百光年，一颗小卫星本身的影子弱得根本看不见——他们怎么敢说「没有」？先别急着答：直接等卫星挡住星光的那一小口，通常会被噪声淹没，这不是正解。换个思路——不看卫星，只看那颗行星。如果它身边真有一颗卫星，行星会做出什么我们能测到的「小动作」？而「什么都没测到」又为什么算好消息？
answer: |
  行星和卫星其实都绕着二者的共同质心转，所以有卫星的行星会在轨道上「打晃」。后果之一：它凌星（从恒星前面经过）的时刻会周期性地早一点、晚一点，这叫凌星时刻变化（TTV），凌星持续的时间也会跟着变（TDV）。JWST 的测光精度极高，能测出极小的时刻偏移；反过来，观测足够久却一丝晃动都没有，就意味着：即使有卫星，质量也只能小于某个上限。所谓「排除」不是「没看见就算了」，而是把上限压下来。这就是好消息的两层含义：一是望远镜灵敏度真达到了能发现系外卫星的水平，二是这颗行星的卫星上限被压得很低，可以直接用来检验卫星是怎么形成的。直觉上「找不到等于失败」，在观测科学里常常相反——先知道「我能看见多小」，「没找到」才有分量。
