question: |
  为什么在南极附近多装几台雷达，能让几千公里外的澳大利亚天气预报变准？
  
  最直觉的答案是：「南极的天气系统会一路北上，飘到澳洲。」但这个说法并不准确——澳洲的暴雨、大风，绝大多数并不是从南极大陆出发的。真正的原因跟「天气预报为什么会越算越不准」有关。
  
  想想看：大气是一整块连通的流体，而南半球中高纬度几乎全是海洋。再想想，一条「大气河」（把热带水汽成条带输送到数千公里外）如果初始位置测错了一点，几天后会变成什么？
answer: |
  关键不在「天气从南极飘到澳洲」，而在「初始值测得准不准」。
  
  数值天气预报本质上是解一组流体方程：先把此刻全球大气的温度、湿度、风、气压尽可能测准，再往前积分。麻烦在于，南半球中高纬度几乎全是海洋——没有密集的探空站、地面站，也缺少北半球那样繁忙的商业航线，卫星之外几乎是空白。南极与南大洋正是这样一个「数据黑洞」。
  
  而大气是连通的：南大洋上生成的锋面、气旋和大气河，正是澳大利亚、新西兰、南美暴雨、暴雪、大风的直接推手。这些系统偏偏诞生在观测最稀疏的海面上，模式只能「猜」它们的初始位置和强度。
  
  更要命的是误差会放大。初始场里一点微小偏差，会被斜压不稳定不断增长，几天后就长成完全不同的天气。所以，只要把上游关键区（南大洋、南极边缘）的初始场修正一点点，整条预报链条的可用时效都会明显延长。
  
  南极雷达的价值，是往黑洞里补观测——它管的是「算得准不准」，而不是「天气从哪里来」。
