question: |
  你早上吃的面包，可能因为几片大陆上同时发生的干旱而贵上三倍。可如果我家附近的小麦田明明没受灾，为什么面包也会变贵？气候变化到底动了哪一根「看不见的线」，让相隔万里的麦区一起缺水？
answer: |
  很多人以为气候变化涨价＝小麦减产，就像苹果歉收苹果贵。但这次的关键不是「减产」，而是「同时减产」。小麦是全球定价的商品，价格取决于全球库存和期货预期。平时只有一个产区干旱，还可以从其他产区补货；可气候变化会改变大气环流，比如让北半球中纬度急流更容易出现「阻塞」现象，使得北美、欧洲、亚洲的多个麦区在相近的年份同时遭遇缺水和热浪。全球库存一旦被压到临界点，市场就会通过期货、囤积和恐慌情绪把价格提前抬高——即使你身边的麦田没受灾，面包也已经跟着变贵。更反直觉的是，人类对小麦的需求几乎没有弹性：供应只缺一点点，价格就会超比例跳升，所以模型预测的不是涨百分之几，而是直接翻三倍。真正值得担心的不是每一块田都减产，而是「同一年，到处都出问题」。这个结论来自气候科学与粮食市场模型的联合研究，提示气候变化的风险不只是局部减产，更是全球粮价系统的脆弱性。
