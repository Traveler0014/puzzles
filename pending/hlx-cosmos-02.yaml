question: |
  假设一夜之间，你认真做的东西被成千上万人喜欢、夸奖，像你的小宇宙里突然亮起无数颗星星。你会更幸福吗？一些内容创作者真的做到了，却反而痛苦到失眠。注意：没有黑粉，全是真诚赞美。那么问题来了：被星星围观，为什么反而让人更怕黑？请往“创作本身”和“被注视的感觉”两层想。
answer: |
  最直觉的解释是：被这么多人爱，怎么会痛苦？所以题目先把“黑粉攻击”这条退路堵死——他们收到的大多是真诚赞美。真正的痛在于，赞美把创作变成了“必须维持的人设”。
  
  第一层，动机被奖励绑架：原本创作是因为“我想做”，粉丝数成了分数后，“我想做”变成“我要交差”，连喜欢的事都变成劳动。心理学上叫“过度辩护效应”：外在奖励会挤出内在热爱。
  
  第二层，拟社会关系让人更孤独：粉丝把你看作亲密朋友，向你倾倒期待，但你并不认识他们；上千份情感单向涌来，你却无法真正回应，于是热闹越大，越觉得自己是在替一个“人设”活着。
  
  第三层，数据成了自我价值：一次作品数据下滑，就足以让“我被爱着”的信念崩塌。粉丝不是具体的人，而是可比较的数字；被一千人爱时，总会看见有人被一万人爱。痛苦不是贪心，而是把自我价值交给了自己控制不了的外部反馈。
