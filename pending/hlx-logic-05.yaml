question: |
  烧绳测时（例如用两根一小时烧完的不均匀香量出45分钟）和天平称假币这两类经典题，看起来无关，其实都靠同一种计数思想。烧绳题里，一次点燃动作能产生的信号是香烧完或火焰相遇；天平题里，一次称量有三种结果（左重、右重、平衡）。请说说：为什么三次天平能称出12枚硬币中哪枚假币、并判断它是偏轻还是偏重？这和用两根香量45分钟有什么共同的底层思路？再总结一下，遇到有限次操作能否达到目标的谜题，怎么先判断有没有解。
answer: |
  三次天平每次有3种结果，三次最多有3×3×3=27种结果序列；12枚硬币中，假币可能是任何一枚且可能偏轻或偏重，共12×2=24种情况。27≥24，所以信息量上有可能，再设计编码方案即可实现。烧绳题同理：一根香从一头点燃只有“60分钟”一个信号，从两头点燃得到“30分钟”一个信号；两根香通过交错点燃，产生“30分钟时触发第二根改变状态”的复合信号，从而把30分钟再切成两半得到15分钟。共同的底层思路是：一次操作能产生几种结果决定了信息容量；把目标分解为可区分的离散状态，再用操作的组合覆盖它。判断有解无解，先数一数所有操作结果组成的状态数是否不小于需要区分的情况数；如果不够，再精巧的构造也无用；如果够，再去找可行的编码方案，这就是信息论式的思考法。
