source: "Quanta Magazine《Ctenophores Aren't Just Beautiful. They're Biological Wonders.》；另据公认结论：栉水母梳板的虹彩来自纤毛排列形成的衍射光栅（结构色），而非生物发光"
sourceUrl: "https://www.quantamagazine.org/ctenophores-arent-just-beautiful-theyre-biological-wonders-20260916/"
author: "auto"
status: draft
question: |
  夜里在海边，有人捞起一只透明的栉水母（海醋栗）。它在水中慢慢游动，身上八条竖排的梳板依次亮起又熄灭，像一道彩虹沿着身体滚动。旁边的人说：「看，它会发光，栉水母是会生物发光的。」请想一想——这道滚动的彩虹，真的是它自己发出来的光吗？如果不是，那它究竟是什么？
answer: |
  不是。把灯一关，彩虹就消失了——它是「借」来的光。栉水母每条梳板上密密排着成千上万根纤毛，纤毛沿梳板依次摆动，形成一条周期只有微米量级的规则波纹，这恰好构成一个会自己波动起来的衍射光栅：周围的白光被它按波长分开，于是红橙黄绿蓝紫依次排开，并随波纹流动。颜色会随你观看的角度、背景光的颜色而变，这正是结构色（和肥皂膜、孔雀羽毛同一类），不消耗它的代谢能量。栉水母里确实有不少种类能真正生物发光：那是荧光素被酶氧化放出蓝绿光，在完全黑暗的深海里依然可见，也因此耗能，通常只在受惊时闪一下。所以辨认办法很简单——关了灯还亮的，是生物发光；关灯就没了、换个角度颜色还会变的，是衍射。把它当成一盏小灯并不准确，它更像一片会游泳的油膜。
