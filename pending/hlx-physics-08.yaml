question: |
  把微波灌进一个形状极不规则的金属腔（比如两端半圆、中间直边的「体育场」形），波在里面来回反射。因为轨迹对初始位置极度敏感，这种腔被叫作「混沌腔」。直觉是：既然轨迹都乱了，腔内驻波的图案也该像电视雪花一样杂乱无章。可实际测到的电场分布常常不是雪花，而是有几条明亮的条纹横穿腔体，像被抓出来的划痕。问：这些亮条纹是沿着什么路径出现的？一条本身极不稳定的轨迹，为什么还能在波的图样里留下清晰的痕迹？
answer: |
  亮条纹出现在「不稳定的周期轨道」上——就是在腔内能闭合成环的经典弹道。它们确实不稳定，偏离一点就会指数发散。但波的本征函数并非由单条轨迹决定，而是所有轨迹的干涉叠加（Gutzwiller 迹公式）：沿某条周期轨道附近往返的那一族轨迹，相位近似对齐，返回时相互加强，于是在轨道位置堆出高强度的「疤」（scar）。不稳定也不等于没有影响——近邻轨迹在指数分离之前，会先沿着轨道「黏」上一段时间，这段相干时间足够在有限波长下留下痕迹。所以「混沌」描述的是轨迹对初值敏感，并不意味着波函数没有结构。Heller 在 1984 年预言了这种疤，后来在微波腔、量子点和光学微腔的实验中都被观测到。
