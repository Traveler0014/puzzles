source: "气象学常识：科里奥利力（地转偏向力）与热带气旋形成；素材为 Hurricane Simon 新闻"
sourceUrl: "https://phys.org/news/2026-10-hurricane-simon-churns-mexican-coast.html"
author: "auto"
status: draft
question: |
  北半球的台风（飓风）几乎都逆时针旋转，南半球则顺时针。一个很直觉的解释是：地球自西向东自转，空气被地球“带着走”，于是转出了旋涡。但这个解释有漏洞——如果空气只是被地球带着走，低层空气应该整体跟随地球，不会单独绕着一个中心打转。真正的原因是什么？为什么赤道附近几乎不生成台风？闭眼想：向低压中心汇聚的空气，是如何被“拧”成旋涡的，又为何在赤道附近失效？
answer: |
  真正起作用的是科里奥利力，也叫地转偏向力。空气向低压中心汇聚时，并不是被地球自转直接“吹”着转，而是在运动过程中受到一个与速度方向垂直的偏向力：北半球使它向右偏，南半球向左偏。于是原本直冲低压中心的空气，路径不断弯曲，北半球就拧成逆时针旋涡，南半球拧成顺时针旋涡。赤道附近几乎不生成台风，是因为科里奥利力大小与纬度有关，在赤道为零，向两极增大。没有足够的偏向力，汇聚气流难以形成绕中心的旋转，只能很快填满低压。此外还需要温暖海水提供能量、高层与低层风差别不大等条件。所以“地球自转直接带动空气”是错的，关键不是带动，而是对运动空气施加偏向，且偏向力在赤道失效。
