question: |
  把三个粒子关进盒子里，让它们互相发光、互相吸收光——听起来只比两个粒子麻烦一点点。可物理学家发现，用普通电脑模拟这种「光与物质」的相互作用，只要每多一个粒子，需要的内存和算力就翻一倍，很快连超算都撑不住。最常见的直觉是：「粒子多了，方程自然就多了嘛。」——但这句话是错的：方程的数量其实只随粒子数线性增加，加一个粒子只多几条。真正爆炸式增长的是另一样东西。那是什么？为什么它必然会爆炸？
answer: |
  爆炸的不是方程数，而是「状态空间」的维数。一个量子系统不是由若干条独立的方程拼成的，它整体只有一个状态；如果每个粒子是二能级的（比如自旋向上/向下，或光子有/无），那么 N 个粒子的联合状态就有 2^N 个基本可能，经典电脑必须老老实实存下 2^N 个复数振幅。30 个粒子就是十亿个数，50 个就超过全世界硬盘的总和。更糟的是，光与物质相互作用会让粒子彼此纠缠，系统的状态没法拆成「每个粒子各管各的」分别算，这正是所谓多体问题。所以难处是原理性的：需要同时记住的信息本身随粒子数指数增长，电脑造得再快也只是把崩溃点往后推几个粒子。费曼 1982 年因此提出：自然不是经典的，与其硬用经典电脑硬算，不如拿一个可控的量子系统去模拟另一个量子系统——这正是量子计算的起点，也是今天「混合量子计算机」想用不同平台分别对付光子和物质的初衷。
