id: hlx-physics-07
category: physics
difficulty: 2
source: "Quanta Magazine《Is There Anything Left in the Dream of Cold Fusion?》，以及关于μ子催化聚变的公认结论：玻尔半径与质量成反比，μ子寿命为2.2微秒，α粘附，能量收支比约为300:1。"
sourceUrl: "https://www.quantamagazine.org/is-there-anything-left-in-the-dream-of-cold-fusion-20261102/"
author: "auto"
status: draft
question: |
  1989年，两位化学家宣布在桌上的电解池里做出了核聚变，几个月后就被推翻——「冷聚变」从此成了笑柄。但「让原子核在低温下靠近」这个想法并没有消失：物理学家改用一种「更重的电子」——μ子；它带负电，质量是电子的207倍。先想一个具体问题：把氢原子里的电子换成μ子，这个「原子」会变成多大？为什么这样两个原子一碰，就能在室温下聚变？再想第二层：你可能觉得「那就多造些μ子，或者造台更强的加速器不就行了」——请先别急着下结论，想想这个直觉错在哪，为什么这条路注定发不了电。
answer: |
  原子的大小由绕核粒子的质量决定：玻尔半径与质量成反比。μ子比电子重207倍，所以「μ氢原子」的半径只有普通氢的约1/207，负电荷被压得紧贴质子。两个这样的原子相遇时，两个质子之间的距离也缩到约百分之一原子尺度，核力的短程吸引便足以压过电荷排斥，无需高温，室温下就能聚变（氘氚聚变，每次约放出17.6 MeV）。这就是「冷聚变」里唯一站得住脚的版本：μ子催化聚变，今天还有实验在做。但算一下账就结束了：μ子本身不稳定，寿命只有2.2微秒；更要命的是，加速器造出一个μ子要花约5 GeV的能量，而一次聚变只放出约17.6 MeV，两者相差约300倍。也就是说，一个μ子至少要催化300次以上聚变才能回本。实际上，它一生只催化约100～150次就衰变了；而且有相当概率被聚变产生的氦核「粘」住带走（α粘附），从此不再参与催化。因此净能量必然为负；问题不在工程是否足够好，而在于账根本算不过来。所以这条研究线如今的价值在中子源、奇异原子物理和核数据，而不在发电。
