source: "Quanta Magazine《Where Does the Quantum World End and Ours Begin?》（Jonathan Halliwell 谈量子退相干）；退相干理论见 Zurek, Physics Today 1991 “Decoherence and the Transition from Quantum to Classical”"
sourceUrl: "https://www.quantamagazine.org/where-does-the-quantum-world-end-and-ours-begin-20260917/"
author: "auto"
status: draft
question: |
  关灯躺下，房间里的桌椅、手机、你的手，都老老实实待在各自的位置上。可同样由原子构成的电子，却能同时「穿过两条缝」，自己和自己干涉。于是有两种常见说法：一，量子力学只管微观，宏观物体「太大」，量子效应被平均掉了；二，因为人一「看」，波函数就塌缩成经典世界。这两种说法对吗？如果不对，那量子世界与我们的世界之间真正的分界在哪里——是尺寸、是质量、还是别的什么？先想一想：为什么一粒悬浮的尘埃，不会同时出现在床的两头？
answer: |
  两种常见说法都站不住。其一，量子力学本身没有尺寸上限，原则上足球也可以有波动性，「太大所以失效」并不是理由；其二，测量之所以起作用，恰恰因为它是一次物理相互作用，意识本身不是关键。
  
  真正的关键是退相干（decoherence）。任何宏观物体都无法与周围环境隔绝：空气分子碰撞、热辐射、光子散射，每一次相互作用都会把物体「相位」的信息——也就是它处于不同位置的叠加之间的相对关系——悄悄泄漏进环境。一旦环境记录下「它在这里」，两部分叠加之间的干涉项就再也观测不到，约化密度矩阵的非对角项迅速衰减到近乎为零。
  
  决定一切的是速度。退相干时间随物体尺度急剧缩短：电子在真空里能保持相干很久；而一粒微米级尘埃在空气中，退相干时间大约只有 10⁻³¹ 秒量级，快到任何观测都来不及。所以在你看它之前，叠加早已散掉了。
  
  因此经典世界不是量子世界的对立面，而是量子力学在强环境耦合下呈现的有效面貌。至于这究竟是客观坍缩，还是观察者分支的更新，至今仍无定论——正好带着这个问题睡着。
