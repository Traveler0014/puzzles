source: "Quanta Magazine《How Do You Take a Picture of a Black Hole?》（天体物理学家 Shep Doeleman 访谈）+ 事件视界望远镜 2019 年 M87 成像结果"
sourceUrl: "https://www.quantamagazine.org/how-do-you-take-a-picture-of-a-black-hole-20261029/"
author: "auto"
status: draft
question: |
  2019 年公布的第一张黑洞照片，是由分布在全球的八台望远镜各自记录、事后拼接出来的；它们最远相隔上万公里，从未连成一体。直觉上，想看得更清楚就该造一面更大的镜子；实在不行，改用波长更短的光（比如可见光）不也能提高清晰度吗？可天文学家两条路都没走。请想想：他们真正缺的是什么？为什么把望远镜分散到地球上能顶得上一面地球那么大的镜子，而换短波长却行不通？
answer: |
  关键不是镜面多大，而是角分辨率：能分辨的最小角度大致等于波长除以口径。M87 黑洞的阴影直径只有约 42 微角秒，相当于从地球看清月球上的一个橙子。用 1.3 毫米的射电波去分辨它，需要约一万公里的口径，也就是地球那么大；但这样的镜子造不出来，因为任何材料都会被自身重量压垮。
  
  于是天文学家改用干涉测量：让相隔几千公里的望远镜两两组成“基线”，各自用原子钟精确记下电波相位，事后把数据对齐并叠加。这样，分辨率由相距最远的两台决定，相当于架起了一面地球大小的镜子。代价是聚光能力并不会因此增加，只有极亮的源才拍得到，而且得到的也不是可见光意义上的“照片”，而是重建出来的图像。
  
  那为什么不换更短的波长，让小口径也够用？因为可见光和红外在到达地面之前就被大气扰动，又被星际尘埃和等离子体散射模糊；1.3 毫米射电波能穿透尘埃，又恰好不被大气挡住。下一个目标是拍“电影”，因为黑洞周围的气体在变化；这需要更多望远镜填满基线，以及能实时对时的记录设备。
