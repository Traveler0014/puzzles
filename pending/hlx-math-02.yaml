question: |
  给地图上色，要求共享一段边界的国家颜色不同——这就是著名的四色定理：不管地图多复杂，四种颜色总够用（三种则不够，三个国家两两接壤时就得用第四色）。现在把规则改一个字：允许同一个国家分成几块互不相连的领土，像阿拉斯加之于美国、加里宁格勒之于俄罗斯。你多半会想，那也不过五种、六种封顶吧。真是这样吗？这时候最少要准备多少种颜色才够用？
answer: |
  不是五种，也不是任何一个固定的数字——需要几种，就能造出需要几种的地图。
  
  构造是这样的：取 n 个国家，每个国家都由两片互不相连的领土组成。内圈按 1、2、…、n 顺时针排成一圈扇形，外圈故意按相反的顺序 n、n-1、…、1 排。这样一来，内圈的每一片都会和外圈的某一片碰上，于是任意两个国家都接壤。既然两两相邻，它们就必须各用一种不同的颜色，总共要 n 种。
  
  而 n 想取多大就取多大，所以这个问题的答案不是某个数，而是「没有上限」。
  
  关键在于「连通」二字：四色定理悄悄用了一个前提——每个国家是一块连成一片的土地。一旦允许飞地，四色立刻失效。这也顺带说明四色定理为何如此难证：它没法靠清点若干种局部情形简单拼出来，任何国家都可能被别国从四面八方「包抄」，局部看着没问题，整体却需要新的论证。
  
  （这正是 Heawood 在 1890 年给出的反例式结论。所以下次看到地图，可以想想：为什么现实中的国家几乎都是连成一片的？）
