id: hlx-math-02
category: math
difficulty: 2
source: "Environmental Research Letters 2025 年研究，经 phys.org 报道：2025 年出生的欧洲人一生经历的极端火险天气比 1950 年出生者多 84%，研究者分解后认为其中约 86% 来自气候变化而非寿命延长"
sourceUrl: "https://phys.org/news/2026-09-children-born-today-europe-extreme.html"
author: "auto"
status: draft
question: |
  新闻说：今天出生的欧洲孩子，一生里会碰上比祖辈多 84% 的极端火险天气。有位朋友不以为意：『这有什么奇怪，现在的人本来就活得久，暴露时间更长，累积起来当然多。』先别急着同意他——请闭着眼算一算：如果气候完全没变，每年极端火险的天数跟 1950 年一模一样，只靠『活得更久』这一条，一生的累积暴露有可能多出 84% 吗？（提示：一生的累积 ≈ 每年天数 × 活了多少年；欧洲人均寿命从 1950 年到现在大约只多活了二三十年。）
answer: |
  不能。一生的累积暴露 ≈ 每年的极端火险天数 × 活了多少年，两个因子各自变大都会推高总量，所以看到『累积多了 84%』时不能立刻归因——这正是这类数字最容易骗人的地方。但反过来把账全推给寿命，同样撑不住：要让 84% 完全由寿命造成，人均寿命必须乘以约 1.84，也就是从 65 岁左右变成 120 岁；而欧洲人均寿命从 1950 年至今只是从 65 岁上下升到 80 岁出头，多了大约四分之一，顶多顶掉增幅中的一部分，远远凑不出 84%。研究者把两个因子分开算过，结论是：这 84% 的增幅里约 86% 来自气候变化本身，只有约 14% 来自寿命延长。剩下那一大块，只能来自『每年的极端火险天数真的变多了』；而且今天出生的孩子所经历的绝大部分，是未来几十年的天气，那时的气候比祖辈度过的一百年更热。所以『只是活得久』这个说法，恰好把因果说反了。
