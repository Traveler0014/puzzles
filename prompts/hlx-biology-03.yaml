question: |
  城市里的绿化带一天到晚有人浇水，可科学家发现，空气里飘着的细小颗粒物（PM2.5）会让这些植物反而更容易‘渴’，也更‘吃不饱’。你觉得这是为什么？别急着说‘挡住阳光’——灰蒙蒙的天只是表象。试着从植物叶片上的‘毛孔’（气孔）想一想。
answer: |
  最直觉的答案是‘PM2.5挡住阳光，光合作用变弱’，但这只是表层。更深一层在于叶片表面的气孔——那是植物呼吸和蒸腾的‘大门’。PM2.5颗粒会沉降在叶面上，甚至钻进气孔里，把‘大门’堵住或弄脏。为了不被堵死的通道憋坏，植物会主动把气孔关小。这一关，水是省了，可二氧化碳也进不来了。二氧化碳是光合作用的原料，原料短缺，植物合成的有机物减少，‘吸收碳’的能力自然下降。更麻烦的是，气孔关小后蒸腾作用减弱，叶片温度升高，植物为了降温又得偷偷开一点气孔，结果水分蒸发和碳吸收的账越算越亏。港大研究指出，这种‘拆东墙补西墙’的调节，让植物的水分利用效率和固碳效率双双下滑。也就是说，空气脏不只让人肺难受，连植物的‘饭量’和‘水杯’都会一起缩水。
