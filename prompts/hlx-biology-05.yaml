question: |
  两个人从陌生人变成朋友，越亲密，他们的大脑活动就会越同步、越像吗？直觉通常会回答“会”：关系好不就是想到一块儿去吗？但苏黎世联邦理工的一项实验发现，成年人一起合作画画几周、关系明显变近后，两人大脑活动的相似度并没有简单上升——有时甚至反而下降。你觉得这是为什么？试试从“默契”和“互补”的区别来想。
answer: |
  直觉把“亲密”等同于“大脑镜像般地同步”，但研究指出，真正默契的协作更像乐器合奏：两个人在不同声部上互补，而不是复制同一个旋律。实验里，搭档共同完成一幅画时，大脑活动相似性只在特定时刻升高——比如两人同时注意画布上的同一处细节，或一起陷入困惑；而在两人分工明确、你画一笔我补一笔时，相似性反而下降，因为各自承担了不同认知任务。所以，关系变近并不意味着大脑“越来越像”，而是学会了更好的协调：何时对齐、何时补位，是一套动态调节，不是静态趋同。这个发现打破了“亲近=脑波同步”的刻板印象，也解释了为什么最要好的朋友未必总是“一个模子刻出来的”，他们更擅长在互动中形成互补的节奏。
