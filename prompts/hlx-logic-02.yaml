id: hlx-logic-02
category: logic
difficulty: 2
source: John H. Conway 的 Doomsday（末日日）算法；Martin Gardner 曾在《Scientific American》专栏介绍
sourceUrl: https://en.wikipedia.org/wiki/Doomsday_rule
author: Traveler
status: published
question: |
  有人能脱口而出"2026 年 8 月 27 日是星期四"，不用翻日历。这不是超能力，
  是一个可以自己推出来的技巧：每年都有一批"锚点日期"永远落在同一个星期几上——
  4/4、6/6、8/8、10/10、12/12，还有"朝九晚五在 7-11"（5/9、9/5、7/11、11/7）。
  只要记住今年的"锚点星期数"，任何日期都能从最近的锚点推过去。
  问题来了：① 这套锚点为什么成立？自己能从零推出下一年的锚点星期数吗
  （提示：365 除以 7 余几）？② 闰年会破坏规律吗，怎么修？③ 这技巧有哪些边界与妙用——
  比如为什么每 28 年日历会整体重演一次？
answer: |
  ① 锚点原理：365 = 7×52 + 1，平年每过一年星期数整体 +1；所以"同一天"的星期数逐年漂移，
  但一年之内任意两个日期的间隔是固定的——锚点日的星期数年内固定，知道锚点星期数就能算全年。
  下一年锚点星期数 = 今年 + 1（平年）或 + 2（闰年，跨过 2/29 时多漂一天）。
  ② 闰年修正：2 月最后一天本身就是一个锚点（平年 2/28、闰年 2/29），1 月锚点是平年 1/3、闰年 1/4；
  跨年计算时对闰年加 2 即可。世纪层面还有修正：2000–2099 的锚点基数是星期二，
  2100 年起每过一个非 400 倍数的世纪年再 +5（等价于每年 +1 的累积）。
  ③ 边界与妙用：它只对格里高利历成立（儒略历漂移不同）；因为星期数完全由
  "年 + 月 + 日 mod 7"决定且闰年以 400 年为周期（400 年含 97 个闰年，146097 天恰是 7 的倍数），
  所以日历每 28 年（不跨世纪跳闰时）或每 400 年整体重演——旧日历真的可以留着循环用。
  心算任意日期星期几（Conway 的 Doomsday 算法）就是把这些步骤压缩成
  "世纪锚点 + 年份代码 + 月日偏移"三步 mod 7 的加法，熟练后两三秒出答案。
