question: |
  独角鲸的长牙是几米长的螺旋形“角”。你可能会想：直的尖牙不是更好看、也更容易刺穿吗？为什么它偏要长成螺旋状？躺下来想一想：螺旋的形状，和“不容易折断”之间，可能有什么关系？注意，答案与“好看”或“刺穿”无关。
answer: |
  这根长牙并不是一根简单的直杆，而是一个双螺旋结构：两条沟槽像麻绳一样绕在牙的表面。直觉上直杆似乎更结实，但对一根细长的牙来说，侧面受到碰撞或弯曲时，受力会集中在某一条直线上，表面的一侧被拉、另一侧被压，容易从这条线开始裂开。而螺旋结构会把弯曲的力量“转”成沿着牙轴旋转的扭转力，就像拧毛巾一样把力分散到整根牙上。牙本质在扭转下不易脆裂，能量被螺旋路径一点点消耗掉，所以螺旋牙反而比同样粗细的直牙更抗弯。研究团队用力学模型发现，这种双螺旋是自然演化出的“防折断设计”，不是神话里的独角兽魔法。
