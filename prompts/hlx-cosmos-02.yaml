question: |
  1977年，望远镜捕捉到一段神秘的“Wow!”无线电信号，至今没解释。当时地球的无线电环境比现在“安静”得多。为了再能听到这样的宇宙耳语，科学家正计划把射电望远镜建到月球背面。你可能立刻想到的理由——比如“离宇宙更近”“太空没空气”——其实都不是关键。那关键是什么？为什么非要选月球背面，而不是在地球上建造更大的望远镜？请先别急着得出答案，试着从“今天为什么更难收到外星信号”这个角度想。
answer: |
  最容易想到的理由往往是“月球离宇宙更近”“太空没有空气”，但都不对。月球离地球约38万公里，相比恒星尺度微不足道；而绕地轨道同样接近真空，也不是关键。真正的原因有两层。第一，地球已被人类发出的无线电波“污染”：卫星、雷达、手机基站、电台的信号混在一起，好比一片噪音大海。1977年那个“Wow!”信号能被发现，是因为当时地球还比较安静；如今同样的信号很可能完全淹没在人类噪声里。第二，地球大气层中的电离层会反射或吸收低频射电波，使宇宙低频信号根本到不了地面。月球背面则同时具备两个条件：它永远背着地球，地球的无线电噪声被月球本体挡住，形成天然的“射电静默区”；它又没有大气和电离层，任何频率的宇宙射电波都能直达。所以月球背面低频射电天文是唯一能同时避开这两种干扰的地点。当然，代价是必须发射中继卫星，才能把数据传回地球。科学家称它为“最后一块宁静的地方”并不过分。
