question: |
  地球内部很热，其中一部分热量来自放射性元素（比如铀、钍）的衰变。可我们既没法钻到地幔去采样，也不能直接看到地下的放射性物质。那科学家是怎么知道地幔里有哪些放射性元素、含量多少的？别急着说“测温度”或“看岩浆”——你有没有想过，有一种东西能穿过整个地球，把地下的秘密带出来？
answer: |
  直觉上，想了解地球内部要么靠钻探，要么靠地震波，但这两种方法都有局限：钻探最多到地壳十几公里，地震波只能反映密度和弹性，无法分辨具体元素。真正的主角是中微子。铀、钍等放射性元素在衰变时，会释放出一种穿透力极强的粒子——中微子（地球中微子准确说是反中微子）。它几乎不与普通物质发生作用，所以能从地幔深处一路穿过整颗地球，既不拐弯也不被吸收。科学家在地球各处布下大型中微子探测器，像搭建一张全球网络，通过识别来自地球内部的中微子的能量和方向，就能反推出地幔中放射性元素的种类与分布。这有点像“隔着厚厚的墙，用穿透墙的X光去拍里面的骨骼”，只是这里的“X光”来自地球自己。反直觉的地方在于：中微子极难探测，但正因为它们几乎不和物质打交道，才能成为唯一能从地幔深处完整逃逸的信使。探测到的中微子数量极少，却足以绘出一幅全新的地幔地图，帮我们理解驱动板块运动的地球“热机”。
