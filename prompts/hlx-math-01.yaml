question: |
  一条河的流域面积越大，主河道就越长。凭直觉，面积是长度乘宽度，所以长度应该差不多是面积的平方根——比如面积变成4倍，长度变2倍。但实际统计全球成千上万条河流发现，长度增长稍快，指数不是0.5，而是约0.6。多出来的那一点“0.1”从哪来？为什么河流不按平方根规律生长？
answer: |
  直觉的0.5次幂来自一个隐含假设：河流是直线，流域是整齐的矩形。但真实河道弯弯曲曲，而且流域边界也凹凸不平。把一条河放大看，小弯里套大弯，支流又分叉，形状在不同尺度上相似——这就是自相似的分形结构。分形曲线在二维平面上占据的“维度”大于1但小于2，所以长度与面积的关系不再是简单的½次幂，而是一个稍大的指数。地球物理学家Hack在20世纪50年代总结出L∝A^h，h约为0.6，后来被称为Hack定律。更深一层，这个0.6并不是偶然：河流系统在长期侵蚀、沉积和地形演化中，会自发组织到一种临界状态，水流、泥沙、岩石的输运达到平衡，使整个水系呈现尺度不变的分支网络。也就是Quanta那篇文章说的，“一道简单的缩放定律给水、岩石和泥沙的混沌带来了秩序”。所以多出来的0.1，本质上是河流弯曲和分形生长留下的烙印——它提醒我们，大自然在看似乱糟糟的外表下，藏着可以写成一个指数的数学规律。
