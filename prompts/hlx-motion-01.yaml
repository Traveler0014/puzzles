id: hlx-motion-01
category: motion
difficulty: 2
source: Kooijman et al. (2011), Science；倒立摆 / 控制论
sourceUrl: https://www.science.org/doi/10.1126/science.1201959
author: 社区示例
status: published
question: |
  自行车骑起来稳稳当当，停下来却立刻倒。很多人说「因为陀螺效应——车轮旋转的角动量」。
  但如果把自行车前轮焊死、让它完全不能转向（抵消一部分陀螺稳定），车还能骑吗？
  再想：杂技演员骑独轮车、人滑旱冰，又靠什么保持平衡？
answer: |
  陀螺效应只占一小部分。实验发现：即使抵消车轮角动量（加反向旋转的轮子），自行车仍能骑稳。
  真正的关键是「转向控制」——骑车人不断微调车把，让支撑点回到重心正下方，形成负反馈。
  独轮车、滑冰同理：靠主动调整，不靠旋转。先证否「全靠陀螺」，再说清「动态平衡 = 持续微调」，
  这是控制论里「倒立摆」的日常版。
