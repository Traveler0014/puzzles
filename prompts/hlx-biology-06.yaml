source: "Phys.org（2026-08）：实验室培养 7 年的最老人脑类器官"
sourceUrl: "https://phys.org/news/2026-08-oldest-human-brain-cells-grown.html"
author: auto
status: published

question: |
  有人把一团胡椒粒大小的人脑细胞放在培养皿里，整整养了7年。它没有眼睛、没有身体，也没有离开过实验室，可研究者说它“记录了时间的流逝”。请你想一想：这种“记录”更像是哪种？是像写日记一样记住发生过的事，还是像树桩年轮一样默默刻下痕迹？为什么？
answer: |
  更像是树桩年轮。这团脑细胞没有大脑结构，也不会有“我活了七年”这种叙事记忆。真正值得注意的是：它在完全脱离身体、没有神经指令和激素信号的情况下，仍然以和人体内脑细胞相似的速度和方式老化。研究者正是观察到这种同步性，才说它“记录了时间的流逝”——即衰老本身就是一种内在的时间记录，而不是靠回忆。
  
  这个结果反直觉之处在于：我们通常认为细胞离开身体后会“失忆”或停滞，像断电的钟表。但它没有，它像一座独立运转的生物钟，把岁月悄悄写进自己的分子结构中。这提示：生命感知时间、留下时间痕迹的能力，可能并不需要一颗完整的大脑，而是深植于每个细胞自身。这项实验也为在体外长期研究人类脑衰老、筛选抗衰老药物提供了一个前所未有的窗口。
