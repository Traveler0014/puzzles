id: hlx-logic-01
category: logic
difficulty: 3
source: 经典称重谜题族（Martin Gardner《Scientific American》数学游戏专栏）
sourceUrl: https://en.wikipedia.org/wiki/Balance_puzzle
author: Traveler
status: published
question: |
  有 10 瓶药，每瓶 10 粒，其中恰好一瓶变质：好药每颗重 1 克，变质药每颗重 1.1 克。
  你有一台足够精确的电子秤，只允许称一次，怎么找出变质的那瓶？
  先别急着说"一瓶瓶试"——你只有一次机会。想通电子秤的版本后，再追问两步：
  换成天平还能只称一次吗？以及，面对这一类"称量找假"的题，有没有一个通用办法
  直接判断"几次称量有没有解"、最少需要几次？
answer: |
  电子秤版：从第 1 瓶取 1 粒、第 2 瓶取 2 粒……第 10 瓶取 10 粒（共 55 粒）一起上秤。
  若全部是好药应重 55 克；实际读数多出 0.1×i 克，就是第 i 瓶变质。
  关键洞察：一次称量不只有一个"是/否"的结果——读数是一个数，能装下 10 种不同的答案。
  天平版：不行。天平一次只有"左沉/右沉/平衡"3 种结果，最多区分 3 种情况，而这里有 10 个嫌疑人。
  要区分 10 瓶至少需要 k 次使 3^k ≥ 10，即 k = 3 次（且 3 次确实构造得出）。
  元方法论：这类题的通用判定就是"数结果"——把每次操作可能产生的结果数乘起来（天平是 3^k，
  电子秤精确读数一次就能区分任意有限多种状态，但前提是读数精度够：如果秤只显示整数克，
  电子秤版也会失效）。"有没有解"看结果总数是否盖过状态数，"最少几次"就是对结果数取对数向上取整。
  十二硬币、猜数字、称球找假全都是这一棵"结果树"的变体。
