question: |
  宇航员在空间站里研究一块金属：把它熔化成液滴，再用磁场让它悬浮在舱内。有人立刻想到：在太空做这个，当然是因为微重力能让液滴“飘起来”不碰容器。但科学家说这个理由只说对了一小半。请问：把熔融金属悬浮起来、不碰容器，真正的关键好处是什么？提示：想想金属熔液在冷却时，容器壁可能扮演什么角色。
answer: |
  真正的关键不是“飘起来好看”，而是“不碰容器”。金属熔液一旦接触容器壁，容器壁上的微小杂质和表面缺陷很容易成为晶体成核的“种子”，让熔液在还没冷透时就开始结晶，变成普通金属。要得到金属玻璃，恰恰要避免结晶：让熔融金属冷却到很低温度、越过成核区间，原子来不及排成整齐晶格，最后“冻”成非晶态的玻璃状结构。容器壁正是破坏这一过程的头号因素。
  
  那为什么非要去国际空间站？地面上也可以用电磁悬浮把液滴托起来，但强悬浮力会搅动液滴、改变流动，重力也会让液滴下垂变形，影响测量。微重力下只需很小的力就能让液滴稳定悬浮，近乎完美球形，便于精确测量黏度、热容等数据，从而找到更容易形成金属玻璃的合金配方。金属玻璃兼具金属的强韧和玻璃的弹性，是很有前景的先进材料。
