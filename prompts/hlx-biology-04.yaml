question: |
  小鼠三周大就成年，人类要十几年。很多人以为人发育慢是因为寿命长、体型大。可科学家比较了人类和小鼠细胞的几千种蛋白质，发现有一个更底层的差异。你觉得这个差异是什么？为什么它能解释发育快慢？
answer: |
  常见的解释——寿命长、体型大——其实都在宏观层面打转。更底层的差异在细胞内的蛋白质周转速率。蛋白质是细胞工作的零件，不停被合成，也不停被降解、更新。研究人员比较了人类和小鼠共有的约4000种蛋白质，发现人类的蛋白质降解速率整体比小鼠慢。降解得慢，意味着每个蛋白质在细胞里停留的时间更长，细胞内的版本更新和状态转换更缓慢。细胞周期中，许多关键蛋白必须在特定时间被降解，周期才能推进；降解慢了，每一个细胞周期的时间被拉长，细胞分裂和分化的节奏随之放慢，整个胚胎和个体发育自然就慢。所以，发育速度的差异，不仅写在基因序列里，还写在蛋白质用多久、换多快的动态平衡里。
